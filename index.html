<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pokemon Flashcards</title>
    <link rel="stylesheet" href="style.css"/>
</head>
<body>
    <header>
        <img id="pokemon-letter-img" alt="pokemon-letter-photo" src="pokemonletter.png"/>
    </header>
    <div class="content">

     <div class="pikachu-card">
        <div class="pikachu-profile-plate">
          <img src="pikachu.png" alt="pikachu"class="pikachu-image"/>
        </div>
        <br>
        <div class="pikachu-name">Pikachu</div>
        <br>
        <br>
        <div class="pikachu-features">
            <p>⚡ <strong>Ability:</strong> Static</p>
            <p>⚡ <strong>Weakness:</strong> Ground</p>
            <p>⚡ <strong>Nature:</strong> Brave & Loyal</p>
        </div>
        </div>

         <div class="eevee-card">
        <div class="eevee-profile-plate">
          <img src="eevee.jpg" alt="eevee"class="eevee-image"/>
        </div>
        <br>
        <div class="eevee-name">Eevee</div>
        <br>
        <br>
        <div class="eevee-features">
            <p>⚡ <strong>Ability:</strong> Static</p>
            <p>⚡ <strong>Weakness:</strong> shy</p>
            <p>⚡ <strong>Nature:</strong> Brave & Loyal</p>
        </div>
        </div>

        <div class="charizard-card">
        <div class="charizard-profile-plate">
          <img src="charizard.png" alt="eevee"class="eevee-image"/>
        </div>
        <br>
        <div class="charizard-name">Charizard</div>
        <br>
        <br>
        <div class="charizard-features">
            <p>⚡ <strong>Ability:</strong> Static</p>
            <p>⚡ <strong>Weakness:</strong> Water</p>
            <p>⚡ <strong>Nature:</strong> Brave & Loyal</p>
        </div>
        


    </div> 
    </div>
    
</body>
</html>
